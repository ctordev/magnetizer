<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>charge preview</title><style>
:root{--mono:ui-monospace,'JetBrains Mono',Consolas,monospace;--line:#2a3140}
body{background:#0b0d12;margin:0;padding:18px;font-family:var(--mono)}
.w{stroke:#cfd7e4;stroke-width:2.2;fill:none;stroke-linecap:round}
.w2{stroke:#8fa0b8;stroke-width:2;fill:none}
.cmp{fill:#2b3140;stroke:#5b6577;stroke-width:1.6}
.coil{fill:#3a2a12;stroke:#ff9f43;stroke-width:1.8}
.steel{fill:#26303c;stroke:#7d8a9c;stroke-width:1.8}
.lbl{font:12px/1.2 var(--mono);fill:#98a3b5}
.lblb{font:600 12.5px/1.2 var(--mono);fill:#e8ecf3}
svg{width:100%;height:auto;display:block}
</style></head><body><svg viewBox="0 0 1400 900" role="img" aria-label="Принципиальная электрическая схема зарядки и запуска, обозначения по ЕСКД">
  <text x="40" y="36" class="lblb" font-size="14">Схема зарядки и запуска (ПР). Обозначения по ЕСКД: ГОСТ 2.702, 2.709–2.755</text>
  <text x="1360" y="36" text-anchor="end" class="lbl" font-size="13">цепи сети и постоянного тока гальванически развязаны через T1</text>

  <!-- ===== СЕТЬ: L (y=140) и N (y=320) ===== -->
  <text x="60" y="78" class="lblb">Сеть 230 В, 50 Гц</text>
  <text x="50" y="144" class="lblb">L</text>
  <text x="50" y="324" class="lblb">N</text>
  <path class="w" d="M60 140 H100 M140 140 H170 M220 140 H250 M300 140 H396 V112 H420 V120 M420 208 V320 M60 320 H100 M140 320 H420"/>
  <circle cx="420" cy="320" r="4" fill="#cfd7e4"/>

  <!-- QF1 автомат двухполюсный -->
  <path class="w" d="M100 140 L134 122 M100 320 L134 302"/>
  <circle cx="100" cy="140" r="3" fill="#cfd7e4"/><circle cx="140" cy="140" r="3" fill="#cfd7e4"/>
  <circle cx="100" cy="320" r="3" fill="#cfd7e4"/><circle cx="140" cy="320" r="3" fill="#cfd7e4"/>
  <path class="w2" d="M120 148 V312" stroke-dasharray="5 4"/>
  <path class="w2" d="M96 136 L104 144 M104 136 L96 144 M96 316 L104 324 M104 316 L96 324"/>
  <text x="150" y="196" class="lblb">QF1</text>
  <text x="150" y="214" class="lbl">6,3 А</text>

  <!-- FU1 -->
  <rect x="170" y="128" width="50" height="24" rx="2" fill="none" stroke="#cfd7e4" stroke-width="2"/>
  <path class="w2" d="M170 140 H220"/>
  <text x="195" y="112" text-anchor="middle" class="lblb">FU1</text>
  <text x="195" y="94" text-anchor="middle" class="lbl">6,3 А</text>

  <!-- VS1 симистор: два встречно-параллельных тиристора, общий электрод управления -->
  <path class="w" d="M262 118 V162 M298 118 V162"/>
  <path d="M262 118 L262 162 L298 140 z" fill="#ff9f43"/>
  <path d="M298 118 L298 162 L262 140 z" fill="none" stroke="#ff9f43" stroke-width="2"/>
  <path class="w" d="M298 162 L312 176 V190"/>
  <text x="280" y="100" text-anchor="middle" class="lblb" fill="#ff9f43">VS1</text>
  <text x="280" y="82" text-anchor="middle" class="lbl">16 А / 400 В</text>

  <!-- U1: модуль фазового управления -->
  <rect x="250" y="190" width="140" height="90" fill="none" stroke="#5b6577" stroke-width="1.6" stroke-dasharray="6 4"/>
  <path class="w" d="M240 140 V190 M330 140 V190"/>
  <circle cx="240" cy="140" r="4" fill="#cfd7e4"/><circle cx="330" cy="140" r="4" fill="#cfd7e4"/>
  <text x="262" y="212" class="lblb">U1</text>
  <text x="262" y="232" class="lbl">R 270 Ом</text>
  <text x="262" y="250" class="lbl">C 100 нФ</text>
  <text x="262" y="268" class="lbl">VS2 динистор</text>

  <!-- RP1: потенциометр ручки (орган управления) -->
  <rect x="196" y="210" width="40" height="40" fill="none" stroke="#cfd7e4" stroke-width="2"/>
  <path class="w" d="M250 222 H236 M250 238 H236"/>
  <path class="w2" d="M216 196 V210 M210 202 L216 210 L222 202"/>
  <text x="216" y="182" text-anchor="middle" class="lblb">RP1</text>
  <text x="206" y="272" text-anchor="middle" class="lbl">упор 395 В</text>

  <!-- T1: первичь / магнитопровод / вторичка -->
  <path class="w" d="M420 120 a11 11 0 0 0 0 22 a11 11 0 0 0 0 22 a11 11 0 0 0 0 22 a11 11 0 0 0 0 22"/>
  <rect x="444" y="112" width="12" height="104" class="steel"/>
  <path class="w" d="M470 120 a11 11 0 0 1 0 22 a11 11 0 0 1 0 22 a11 11 0 0 1 0 22 a11 11 0 0 1 0 22"/>
  <text x="450" y="100" text-anchor="middle" class="lblb">T1</text>
  <text x="450" y="82" text-anchor="middle" class="lbl">230 → 275 В, 400 ВА</text>

  <!-- вторичка к мосту -->
  <path class="w" d="M470 208 V216 H512 V370 H600"/>
  <path class="w" d="M470 120 V112 H530 V320 H600"/>
  

  <!-- VDS1: выпрямительный мост (обозначение прямоугольником с выводами) -->
  <rect x="600" y="300" width="160" height="120" fill="none" stroke="#cfd7e4" stroke-width="2"/>
  <text x="680" y="342" text-anchor="middle" class="lblb">VDS1</text>
  <text x="680" y="362" text-anchor="middle" class="lbl">мост 1000 В</text>
  <text x="612" y="318" class="lblb">a</text>
  <text x="612" y="386" class="lblb">b</text>
  <text x="748" y="334" text-anchor="end" class="lblb">+</text>
  <text x="748" y="386" text-anchor="end" class="lblb">−</text>
  <text x="670" y="452" text-anchor="middle" class="lbl">к «+» только катоды, к «−» аноды</text>
  <text x="640" y="474" text-anchor="middle" class="lbl" fill="#43c59e">постоянный ток банка в T1 не идёт</text>

  <!-- шины постоянного тока -->
  <path class="w" d="M760 320 H790 V210 H824 M856 210 H900 M950 210 H1250"/>
  <circle cx="790" cy="210" r="4" fill="#cfd7e4"/>
  <path class="w" d="M760 370 H790 V560 H1250"/>

  <text x="768" y="204" class="lblb">+</text>
  <text x="778" y="554" class="lblb">−</text>

  <!-- RV1: варистор на шинах -->
  <circle cx="800" cy="210" r="4" fill="#cfd7e4"/>
  <path class="w" d="M800 210 V250 M800 290 V560"/>
  <rect x="790" y="250" width="20" height="40" fill="none" stroke="#cfd7e4" stroke-width="2"/>
  <path class="w2" d="M784 296 L816 244 M816 244 V236"/>
  <circle cx="800" cy="560" r="4" fill="#cfd7e4"/>
  <text x="784" y="264" text-anchor="end" class="lblb">RV1</text>
  <text x="784" y="282" text-anchor="end" class="lbl">470 В</text>

  <!-- EL1: балласт -->
  <circle cx="840" cy="210" r="16" fill="none" stroke="#cfd7e4" stroke-width="2"/>
  <path class="w2" d="M829 199 L851 221 M851 199 L829 221"/>
  <text x="840" y="170" text-anchor="middle" class="lblb">EL1</text>
  <text x="840" y="152" text-anchor="middle" class="lbl">100 Вт — балласт</text>

  <!-- US2: узел порога crowbar, подключён к шинам, управление на VT2 -->
  <circle cx="880" cy="210" r="4" fill="#cfd7e4"/>
  <path class="w" d="M880 210 V250 M880 300 V560"/>
  <rect x="866" y="250" width="28" height="50" fill="none" stroke="#cfd7e4" stroke-width="2"/>
  <circle cx="880" cy="560" r="4" fill="#cfd7e4"/>
  <text x="902" y="262" class="lblb">US2</text>
  <path class="w2" d="M894 306 H980" stroke-dasharray="5 4"/>

  <!-- QS1: выключатель цепи заряда -->
  <circle cx="900" cy="210" r="3" fill="#cfd7e4"/><circle cx="950" cy="210" r="3" fill="#cfd7e4"/>
  <path class="w" d="M900 210 L946 186"/>
  <text x="925" y="170" text-anchor="middle" class="lblb">QS1</text>
  <text x="925" y="130" text-anchor="middle" class="lbl">выключатель заряда</text>

  <!-- VT2: тиристор crowbar -->
  <circle cx="1010" cy="210" r="4" fill="#cfd7e4"/>
  <path class="w" d="M1010 210 V270"/>
  <path d="M996 270 L1024 270 L1010 296 z" fill="#ff9f43"/>
  <path class="w" d="M994 296 H1026 M1010 296 V330 M1010 380 V560"/>
  <rect x="1000" y="330" width="20" height="50" fill="none" stroke="#cfd7e4" stroke-width="2"/>
  <text x="992" y="346" text-anchor="end" class="lblb">R5</text>
  <text x="992" y="364" text-anchor="end" class="lbl">10 Ом</text>
  <path class="w" d="M996 284 L980 298 V306"/>
  <circle cx="1010" cy="560" r="4" fill="#cfd7e4"/>
  <text x="952" y="286" text-anchor="end" class="lblb" fill="#ff9f43">VT2</text>

  <!-- C1: банк -->
  <circle cx="1060" cy="210" r="4" fill="#cfd7e4"/>
  <path class="w" d="M1060 210 V300 M1060 314 V560"/>
  <path class="w" d="M1030 300 H1090 M1030 314 H1090"/>
  <text x="1036" y="292" class="lblb">+</text>
  <text x="1064" y="290" class="lblb">C1…C12</text>
  <text x="1064" y="272" class="lbl">35,9 мФ</text>
  <circle cx="1060" cy="560" r="4" fill="#cfd7e4"/>

  <!-- SA1 + EL2: разряд банки -->
  <circle cx="1120" cy="210" r="4" fill="#cfd7e4"/>
  <path class="w" d="M1120 210 V250 M1120 290 V324 M1120 356 V560"/>
  <circle cx="1120" cy="250" r="3" fill="#cfd7e4"/><circle cx="1120" cy="290" r="3" fill="#cfd7e4"/>
  <path class="w" d="M1120 250 L1136 282"/>
  <circle cx="1120" cy="340" r="16" fill="none" stroke="#cfd7e4" stroke-width="2"/>
  <path class="w2" d="M1109 329 L1131 351 M1131 329 L1109 351"/>
  <text x="1142" y="262" class="lblb">SA1</text>
  <text x="1142" y="345" class="lblb">EL2</text>
  <circle cx="1120" cy="560" r="4" fill="#cfd7e4"/>

  <!-- PV1: вольтметр с делителем -->
  <circle cx="1200" cy="210" r="4" fill="#cfd7e4"/>
  <path class="w" d="M1200 210 V246 M1200 282 V340 M1200 380 V400 M1200 440 V560"/>
  <circle cx="1200" cy="264" r="18" fill="none" stroke="#cfd7e4" stroke-width="2"/>
  <text x="1200" y="270" text-anchor="middle" class="lblb" font-size="15">V</text>
  <rect x="1190" y="340" width="20" height="40" fill="none" stroke="#cfd7e4" stroke-width="2"/>
  <rect x="1190" y="400" width="20" height="40" fill="none" stroke="#cfd7e4" stroke-width="2"/>
  <text x="1224" y="270" class="lblb">PV1</text>
  <text x="1224" y="352" class="lblb">R2</text>
  <text x="1224" y="412" class="lblb">R3</text>
  <circle cx="1200" cy="560" r="4" fill="#cfd7e4"/>

  <!-- цепь разряда: FU3, VT1 (тиристор), L1 оснастка, VD6 на клеммах -->
  <circle cx="1250" cy="210" r="4" fill="#cfd7e4"/>
  <path class="w" d="M1250 210 V240 M1250 276 V300 M1250 326 V352 M1250 448 V560"/>
  <rect x="1240" y="240" width="20" height="36" rx="2" fill="none" stroke="#cfd7e4" stroke-width="2"/>
  <path class="w2" d="M1240 240 H1260 M1250 240 V276"/>
  <path d="M1236 300 L1264 300 L1250 326 z" fill="#ff9f43"/>
  <path class="w" d="M1234 326 H1266"/>
  <path class="w" d="M1266 322 L1284 338"/>
  <path class="w2" d="M1284 338 V600" stroke-dasharray="5 4"/>
  <path class="coil" d="M1250 352 q14 12 0 24 q14 12 0 24 q14 12 0 24 q14 12 0 24" fill="none"/>
  <circle cx="1250" cy="352" r="4" fill="#cfd7e4"/><circle cx="1250" cy="448" r="4" fill="#cfd7e4"/>
  <path class="w" d="M1250 352 H1310 V396 M1310 420 V448 H1250"/>
  <path d="M1298 420 L1322 420 L1310 396 z" fill="#43c59e"/>
  <path class="w" d="M1298 396 H1322"/>
  <circle cx="1250" cy="560" r="4" fill="#cfd7e4"/>
  <text x="1250" y="190" text-anchor="end" class="lblb">FU3</text>
  <text x="1272" y="306" class="lblb" fill="#ff9f43">VT1</text>
  <text x="1272" y="392" text-anchor="middle" class="lblb">L1</text>
  <text x="1330" y="404" class="lblb" fill="#43c59e">VD6</text>
  <text x="1330" y="426" class="lbl" fill="#43c59e">= D2, §2</text>

  <!-- US1: узел запуска VT1 -->
  <rect x="1210" y="600" width="120" height="70" fill="none" stroke="#5b6577" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="1270" y="622" text-anchor="middle" class="lblb">US1</text>
  <text x="1270" y="642" text-anchor="middle" class="lbl">запуск VT1</text>
  <text x="1270" y="660" text-anchor="middle" class="lbl">SA2 «Пуск», R, C</text>

  <!-- экран T1 и PE -->
  <path class="w2" d="M450 216 V740" stroke-dasharray="6 4"/>
  <path class="w" d="M422 740 H478 M432 752 H468 M442 764 H458"/>
  <text x="500" y="756" class="lbl">PE — корпус кожуха</text>

  <!-- примечания -->
  <text x="40" y="800" class="lblb" fill="#43c59e">FU2 снят: последовательный балласт EL1 ограничивает ток заряда 0.9 А, за пределы 6.3 А он не выходит — сгорит лампа, а не сработает плавкая вставка. В сети остаётся FU1.</text>
  <text x="40" y="822" class="lbl">Развязка — мост VDS1: к «+» только катоды, к «−» только аноды, постоянный ток банка в T1 не идёт (модель: 20 мА, 350 → 352 В).</text>
  <text x="40" y="844" class="lbl">EL2 (разряд) образует с балластом EL1 делитель: при включённой разрядной цепи напряжение не поднимется выше 68–198 В.</text>
  <text x="40" y="866" class="lblb" fill="#ffb020">Алгоритм: заряд (EL1 светится) → QS1 выключает заряд → кожух закрыт (SA1, EL2 обесточены) → выстрел (US1 → затвор VT1).</text>
  <text x="40" y="888" class="lbl">Цепь разряда (FU3, VT1, L1, VD6) показана со стороны шин: вся схема — в §1, форма тока VD6 — в §2.</text>
</svg>
</body></html>
