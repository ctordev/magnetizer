<!-- ПРЕЖНЯЯ РЕВИЗИЯ. Схема зарядки переработана: обычный двухобмоточный T1 (230 В → 255 В с
     отводом от середины), режимы «255 В» / «127 В» переключателем SA3, PE в конструкции нет.
     Актуальные рисунки — calc/src/charge_block1_gost.svg и calc/src/charge_block2_gost.svg. -->
<svg viewBox="0 0 1320 600" role="img" aria-label="Схема зарядки банки">
  <defs>
    <marker id="arwC" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ff6b6b"/>
    </marker>
  </defs>

  <text x="40" y="34" class="lblb" font-size="14">Сеть → диммер → T1 230→280 В → мост → балласт → D1 → банка</text>
  <text x="700" y="34" class="lblb" font-size="14" fill="#ffb020">упор ручки «полностью открыто» = 395 В, а не 649 В</text>

  <!-- СЕТЬ -->
  <rect x="40" y="200" width="130" height="110" rx="10" class="cmpf"/>
  <text x="105" y="228" text-anchor="middle" class="lblb">СЕТЬ 230 В</text>
  <text x="105" y="250" text-anchor="middle" class="lbl">fuse 6.3 А</text>
  <text x="105" y="268" text-anchor="middle" class="lbl">LC-фильтр</text>
  <text x="105" y="286" text-anchor="middle" class="lbl">вилка с PE</text>
  <path class="w" d="M170 210 H200 V150 H240"/>
  <path class="w" d="M170 300 H200 V420 H470"/>

  <!-- ДИММЕР -->
  <rect x="240" y="105" width="170" height="100" rx="10" class="cmp"/>
  <text x="325" y="130" text-anchor="middle" class="lblb">диммер-модуль 16 А</text>
  <text x="325" y="150" text-anchor="middle" class="lbl">фазовое управление</text>
  <text x="325" y="167" text-anchor="middle" class="lbl" font-size="11">симметричный, не «LED»</text>
  <text x="325" y="184" text-anchor="middle" class="lbl" font-size="11">RC-snubber 100 нФ+100 Ом</text>
  <text x="325" y="225" text-anchor="middle" class="lbl" fill="#ff6b6b">отказ = КЗ → 100% отдачи</text>
  <path class="w" d="M410 150 H470"/>

  <!-- T1 -->
  <path class="w" d="M470 150 V160"/>
  <path class="w" d="M470 160 q22 14 0 28 q22 14 0 28 q22 14 0 28 q22 14 0 28"/>
  <path class="w" d="M470 272 V420"/>
  <path class="steel" d="M486 170 V310 M493 170 V310"/>
  <path class="w" d="M508 160 q22 14 0 28 q22 14 0 28 q22 14 0 28 q22 14 0 28 V320"/>
  <text x="489" y="120" text-anchor="middle" class="lblb">T1: 230 → 270–280 В</text>
  <text x="489" y="138" text-anchor="middle" class="lbl">400–600 ВА</text>

  <!-- варистор -->
  <path class="w2" d="M530 200 V240 M530 280 V310 M530 200 H534 M530 310 H534"/>
  <rect x="522" y="240" width="16" height="40" rx="4" class="cmp"/>
  <text x="530" y="382" text-anchor="middle" class="lbl">варистор 470 В</text>

  <!-- МОСТ -->
  <rect x="560" y="210" width="140" height="120" rx="10" class="cmp"/>
  <path class="w2" d="M575 270 L630 225 L685 270 L630 315 Z"/>
  <path d="M588 262 L608 246 L604 268 z" fill="#43c59e"/>
  <path d="M652 294 L672 278 L668 300 z" fill="#43c59e"/>
  <path d="M672 262 L652 246 L656 268 z" fill="#43c59e"/>
  <path d="M608 294 L588 278 L592 300 z" fill="#43c59e"/>
  <text x="630" y="352" text-anchor="middle" class="lbl">мост KBPC5010/10010 · 1000 В</text>
  <text x="566" y="238" class="lbl" font-size="11">AC</text>
  <text x="566" y="304" class="lbl" font-size="11">AC</text>
  <text x="694" y="238" text-anchor="end" class="lbl" font-size="11">DC+</text>
  <text x="694" y="304" text-anchor="end" class="lbl" font-size="11">DC−</text>
  <path class="w" d="M508 160 H534 V240 H560"/>
  <path class="w" d="M508 320 H534 V300 H560"/>
  <path class="w" d="M700 240 H730 V150 H756"/>
  <path class="w" d="M700 300 H740 V420"/>

  <!-- предохранитель зарядной ветки -->
  <rect x="756" y="138" width="36" height="24" rx="4" class="cmp"/>
  <path class="w" d="M756 150 H792"/>
  <text x="774" y="122" text-anchor="middle" class="lbl">fuse 6.3 А</text>

  <!-- балласт -->
  <rect x="800" y="130" width="76" height="40" rx="6" class="cmp"/>
  <path class="w2" d="M812 150 h8 l5 -11 l6 22 l5 -11 h8"/>
  <path class="w" d="M876 150 H900"/>
  <text x="820" y="192" text-anchor="middle" class="lbl">балласт: 1–2 лампы 100 Вт</text>
  <text x="820" y="210" text-anchor="middle" class="lbl">светится = идёт заряд</text>

  <!-- D1 -->
  <path d="M900 132 L900 168 L924 150 z" fill="#43c59e" opacity=".92"/>
  <path class="w" d="M924 132 V168"/>
  <path class="w" d="M924 150 H1010"/>
  <text x="912" y="112" class="lblb" fill="#43c59e">D1 развязывающий 100 А/1000 В · мост его не заменяет</text>
  <path stroke="#ff6b6b" stroke-width="2.6" d="M928 140 L946 160 M946 140 L928 160"/>

  <!-- crowbar -->
  <path class="w" d="M960 150 V240"/>
  <path d="M948 240 L972 240 L960 272 z" fill="#ff9f43" opacity=".9"/>
  <path class="w" d="M948 272 H972"/>
  <path class="w2" d="M952 266 L930 286"/>
  <path class="w" d="M960 272 V420"/>
  <text x="955" y="250" text-anchor="end" class="lblb" fill="#ff9f43">crowbar ≈ 420 В</text>
  <text x="955" y="268" text-anchor="end" class="lbl">защита от отказа</text>
  <text x="955" y="284" text-anchor="end" class="lbl">диммера → fuse</text>

  <!-- банка -->
  <path class="w" d="M1010 150 V205"/>
  <path class="w" d="M982 205 H1038 M982 219 H1038"/>
  <path class="w" d="M1010 219 V420"/>
  <text x="1044" y="212" class="lblb">банка 35.9 мФ</text>
  <text x="1044" y="230" class="lbl">300–350 В · вольтметр</text>
  <text x="1044" y="246" class="lbl">через 10 МОм + 10 кОм</text>

  <!-- разряд -->
  <path class="w" d="M1060 150 V200"/>
  <rect x="1046" y="200" width="28" height="40" rx="5" class="cmp"/>
  <path class="w2" d="M1052 220 h5 l4 -9 l5 18 l4 -9 h5"/>
  <path class="w" d="M1060 240 V262"/>
  <path class="w" d="M1060 262 L1078 288"/>
  <path class="w" d="M1060 300 V420"/>
  <circle cx="1060" cy="262" r="3" fill="#cfd7e4"/>
  <circle cx="1060" cy="300" r="3" fill="#cfd7e4"/>
  <path class="w" d="M1010 150 H1060"/>
  <text x="1082" y="186" class="lblb">разряд: 1–2 лампы</text>
  <text x="1082" y="316" class="lbl">концевик кожуха</text>

  <!-- нагрузка (напоминание) -->
  <path class="w" d="M1130 150 V190"/>
  <rect x="1118" y="190" width="24" height="22" rx="3" class="cmp" opacity=".7"/>
  <path class="w" d="M1130 212 V232" opacity=".7"/>
  <path d="M1118 232 L1142 232 L1130 264 z" fill="#ff9f43" opacity=".55"/>
  <path class="w" d="M1118 264 H1142 M1130 264 V300" opacity=".7"/>
  <path class="coil" d="M1130 300 q22 12 0 24 q22 12 0 24 q22 12 0 24" fill="none"/>
  <path class="w" d="M1130 372 V420" opacity=".7"/>
  <path class="w" d="M1010 150 H1130"/>
  <text x="1158" y="204" class="lbl" fill="#98a3b5">aR 50–80 А</text>
  <text x="1158" y="262" class="lbl" fill="#98a3b5">VT1</text>
  <text x="1158" y="288" class="lbl" fill="#98a3b5" font-size="11">оснастка 4.2 кА</text>

  <!-- шина низкая -->
  <path class="w" d="M740 420 H1130"/>
  <text x="330" y="452" class="lbl">Цепи сети и банки гальванически развязаны (T1), корпус кожуха — на PE.</text>
  <text x="1024" y="452" class="lbl" fill="#ff6b6b" font-size="11">разряд — на время заряда ОТКЛЮЧЕН:</text>
  <text x="1024" y="470" class="lbl" fill="#ff6b6b" font-size="11">иначе делитель с балластом: 68/198 В</text>

  <!-- путь тока без D1 -->
  <path stroke="#ff6b6b" stroke-width="2" stroke-dasharray="7 5" fill="none"
        d="M1000 434 H752 V306 H706 M706 246 H752 V176 H890" marker-end="url(#arwC)"/>
  <text x="40" y="490" class="lblb" fill="#ff6b6b">Без D1 контур замкнут: банк+ → VT1 → оснастка → банк− → DC− моста → диод → вторичка → диод → DC+ → банк+.</text>
  <text x="40" y="512" class="lbl" fill="#ff6b6b">327–466 А и i²t 3.3–6.5 кА²с за 68 мс: мост на 50 А (i²t ≈ 1.5 кА²с) и симистор диммера в первичке (×4 по i²t) сгорают.</text>
  <text x="40" y="534" class="lblb" fill="#ffb020">Порядок: зарядил (лампа погасла) → реле заряда ОТКЛЮЧИЛО цепь → кожух закрыт, разрядная лампа отключена → выстрел.</text>
  <text x="40" y="556" class="lbl">Реле/контактор в зарядной ветке желателен: тогда D1 не нагружен, а индуктивный ток обмотки (≈300 А, 450 Дж) не дотекает через D2.</text>
</svg>
